ai_chat.settings_form:
  path: '/admin/config/system/ai-chat'
  defaults:
    _form: '\Drupal\ai_chat\Form\AiChatSettingsForm'
    _title: 'AI chat'
  requirements:
    _permission: 'administer site configuration'

ai_chat.api:
  path: '/api/v1/ai-chat'
  defaults:
    _controller: '\Drupal\ai_chat\Controller\AiChatController::aiChat'
    _format: json
  methods:  [POST]
  requirements:
    # Public on purpose: the chat widget posts here for anonymous visitors.
    # The controller applies the per-IP rate limit and validates the body.
    _access: 'TRUE'
  options:
    no_cache: TRUE
